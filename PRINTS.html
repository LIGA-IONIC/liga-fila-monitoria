<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Â· Fila Monitoria</title>
<link rel="stylesheet" href="prints.css">
<style>body{background:#fff;padding:16px 12px 32px}.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}.bloco h2{display:none}.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}.tb{background:#c2410c}.btn.main{background:#c2410c}</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Fila Monitoria</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Ana — Angular</strong><div class="muted">posicao 1</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Bruno — Firebase</strong><div class="muted">posicao 2</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Carla — CSS</strong><div class="muted">posicao 3</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Diego — Rotas</strong><div class="muted">posicao 4</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Elena — Service</strong><div class="muted">posicao 5</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Fila Monitoria</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="aviso erro">Fila cheia (max. 5)</div><div class="item"><div><strong>Voce</strong><div class="muted">tentando entrar</div></div><span class="badge bad">bloqueado</span></div><div class="aviso erro">Aguarde alguem sair da fila</div><button class="btn ghost">Entrar na fila</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
